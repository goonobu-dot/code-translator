<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コード通訳</title>
<style>
  :root {
    --bg:#F7F8F7; --surface:#FFF; --ink:#242B2E; --muted:#67736F; --line:#E2E5E0;
    --accent:#0E7C66; --soft:#F2F4F1;
    --ok-bg:#E7F2EE; --ok-fg:#085041; --warn-bg:#FBF3E1; --warn-fg:#633806;
    --crit-bg:#FBEAE8; --crit-fg:#791F1F;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#14181A; --surface:#1D2326; --ink:#E4E8E4; --muted:#96A29E; --line:#2C3538;
    --accent:#3FB392; --soft:#252C2F;
    --ok-bg:#1C2E29; --ok-fg:#7DD3B9; --warn-bg:#2E2718; --warn-fg:#E0B45E;
    --crit-bg:#331E1C; --crit-fg:#E88B81;
  } }
  :root[data-theme="dark"] {
    --bg:#14181A; --surface:#1D2326; --ink:#E4E8E4; --muted:#96A29E; --line:#2C3538;
    --accent:#3FB392; --soft:#252C2F;
    --ok-bg:#1C2E29; --ok-fg:#7DD3B9; --warn-bg:#2E2718; --warn-fg:#E0B45E;
    --crit-bg:#331E1C; --crit-fg:#E88B81;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; font-size:13.5px; line-height:1.7; }
  header { position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line); padding:7px 14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  header .title { font-weight:700; font-size:13.5px; }
  .badge { font-size:11px; padding:1px 8px; border-radius:999px; white-space:nowrap; }
  .b-ok { background:var(--ok-bg); color:var(--ok-fg); }
  .b-warn { background:var(--warn-bg); color:var(--warn-fg); }
  .b-crit { background:var(--crit-bg); color:var(--crit-fg); }
  .hbtn { border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:2px 10px; font-size:11.5px; cursor:pointer; color:var(--muted); font-family:inherit; }
  .hbtn.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  main { padding:12px 16px 80px; max-width:940px; margin:0 auto; }
  .filebar { display:flex; gap:5px; padding:8px 16px 0; flex-wrap:wrap; align-items:center; max-width:940px; margin:0 auto; }
  .filebar .lbl { font-size:11px; color:var(--muted); }
  .fbtn { font-family:Menlo,monospace; font-size:11.5px; padding:3px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
  .fbtn.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .fbtn .fd { font-family:"Hiragino Kaku Gothic ProN",sans-serif; font-size:11px; margin-left:6px; }
  .fbtn .fd.ok { color:var(--ok-fg); } .fbtn.on .fd.ok { color:inherit; }
  .fbtn .fd.warn { color:var(--warn-fg); } .fbtn.on .fd.warn { color:inherit; }
  .summary { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 14px; margin-bottom:10px; font-size:13px; }
  .summary .lb { font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:.08em; }
  .guide { border-left:3px solid var(--accent); padding:2px 12px; margin-bottom:10px; font-size:12.5px; color:var(--muted); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .gbtn { font-family:inherit; font-size:11px; padding:1px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; }
  .filehead { font-size:13px; font-weight:700; margin:16px 0 6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .filehead .role { font-weight:400; color:var(--muted); font-size:12px; }
  .achip { font-size:10px; font-weight:400; background:var(--soft); color:var(--muted); padding:0 7px; border-radius:999px; }
  .pairsfile { border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:20px; background:var(--surface); }
  .sec { display:grid; grid-template-columns:minmax(0,26rem) minmax(0,1fr); }
  .sec + .sec .sec-l { border-top:1px solid var(--line); }
  .sec:hover .sec-r { background:#262E34; }
  .sec.flash .sec-r { background:#2B3440; }
  .sec.imp .sec-l { box-shadow:inset 3px 0 0 var(--warn-fg); }
  .sec.done-ok .sec-l { box-shadow:inset 3px 0 0 var(--ok-fg); }
  .sec.done-ng .sec-l { box-shadow:inset 3px 0 0 var(--crit-fg); }
  .sec-l { padding:9px 14px 9px; display:flex; flex-direction:column; }
  .sec-h { font-weight:700; font-size:13.5px; line-height:1.6; margin-bottom:2px; display:flex; align-items:baseline; gap:8px; }
  .sec-h .sec-a { margin:0 0 0 auto; font-weight:400; }
  .crumb { font-size:10.5px; color:var(--muted); font-family:Menlo,monospace; margin-bottom:3px; }
  .crumb .cn { border-bottom:1px dashed var(--line); cursor:pointer; }
  .impb { font-size:10px; font-weight:700; color:var(--warn-fg); background:var(--warn-bg); border-radius:999px; padding:0 7px; white-space:nowrap; }
  .sec-p { font-size:13.5px; line-height:1.75; color:var(--ink); }
  .sec-warn { font-size:12px; color:var(--warn-fg); background:var(--warn-bg); border-radius:6px; padding:4px 10px; margin-top:6px; line-height:1.65; }
  .sec-a { font-size:10.5px; color:var(--muted); font-family:Menlo,monospace; }
  .sec-r { background:#1F2428; color:#D6DEE3; padding:8px 0; overflow-x:auto; font-family:Menlo,monospace; font-size:12px; line-height:1.75; }
  .ln { display:flex; padding:0 14px; white-space:pre; }
  .ln .no { width:32px; color:#5C666D; flex-shrink:0; user-select:none; }
  .kw { border-bottom:1px dotted #7BA8C4; cursor:help; }
  .c-com { color:#8A99A3; } .c-str { color:#E8B36A; } .c-key { color:#8FBFE8; }
  .ref { border-bottom:1px dashed #6BC5A8; cursor:pointer; }
  .ref:hover { color:#8FE3C6; }
  .flow { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 14px 7px; margin-bottom:10px; font-size:13px; }
  .flow .lb { font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:.08em; }
  .flow ol { margin:4px 0 4px; padding-left:1.5em; }
  .flow li { margin-bottom:2px; cursor:pointer; }
  .flow li:hover { color:var(--accent); }
  .flow li .fa { font-size:10.5px; color:var(--muted); font-family:Menlo,monospace; margin-left:6px; }
  @keyframes ctflash { 0% { background:var(--warn-bg); } 100% { background:transparent; } }
  .sec.flash .sec-l { animation:ctflash 1.4s ease-out; }
  .flow .play { font-family:inherit; font-size:11px; padding:1px 10px; border-radius:999px; border:1px solid var(--accent); background:var(--surface); color:var(--accent); cursor:pointer; margin-left:8px; }
  #storybar { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:8; background:var(--surface); border:1px solid var(--accent); border-radius:12px; padding:8px 14px; max-width:min(560px, 92vw); box-shadow:0 4px 18px rgba(0,0,0,.18); display:flex; gap:10px; align-items:center; font-size:12.5px; }
  #storybar .tx { line-height:1.6; }
  #storybar .no2 { font-size:10.5px; color:var(--muted); white-space:nowrap; }
  #storybar button { font-family:inherit; font-size:11.5px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap; }
  #storybar .nx { border-color:var(--accent); color:var(--accent); }
  body.storying .warp { display:none; }
  body.storying main { padding-bottom:160px; }
  .ctrl { margin-top:auto; padding-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; opacity:.55; transition:opacity .15s; }
  .sec:hover .ctrl, .sec:focus-within .ctrl { opacity:1; }
  .ctrl button { font-family:inherit; font-size:11.5px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; }
  .ctrl .ok:hover { border-color:var(--ok-fg); color:var(--ok-fg); }
  .ctrl .ng:hover { border-color:var(--crit-fg); color:var(--crit-fg); }
  .ctrl .st { font-size:11.5px; font-weight:700; padding:1px 9px; border-radius:999px; }
  .ctrl .st.ok { background:var(--ok-bg); color:var(--ok-fg); }
  .ctrl .st.ng { background:var(--crit-bg); color:var(--crit-fg); }
  .ctrl .st.uk { background:var(--soft); color:var(--muted); }
  .ctrl .undo { font-size:10.5px; color:var(--muted); border:none; text-decoration:underline; background:none; padding:0; }
  .cwrap summary { font-size:11px; color:var(--muted); cursor:pointer; list-style:none; }
  .cwrap summary::before { content:"💬 "; }
  .cwrap textarea { width:100%; min-height:48px; margin-top:5px; font-family:inherit; font-size:12.5px; line-height:1.6; padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); resize:vertical; }
  .comment-view { font-size:12px; background:var(--soft); border-radius:6px; padding:4px 10px; margin-top:6px; }
  .comment-view .cl { font-size:10px; font-weight:700; color:var(--muted); }
  .sec.veiled { cursor:pointer; }
  .sec.veiled .sec-h, .sec.veiled .sec-p, .sec.veiled .ctrl, .sec.veiled .cwrap, .sec.veiled .comment-view { display:none; }
  .sec.veiled .sec-l::before { content:"❓ この数行は何をしている? — まず右のコードを読んで予想 → ここをクリックで答え"; color:var(--muted); font-size:13px; display:block; line-height:1.7; }
  body.en .sec.veiled .sec-l::before { content:"❓ What do these lines do? — read the code, make a guess, then click here for the answer"; }
  .verdict { border-radius:10px; padding:10px 14px; font-size:12.5px; margin-top:16px; }
  .verdict.locked { background:var(--crit-bg); color:var(--crit-fg); }
  .verdict.open { background:var(--ok-bg); color:var(--ok-fg); }
  .verdict ul { margin:6px 0 0; padding-left:1.4em; }
  .findings { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-size:12.5px; margin-top:10px; }
  .findings li { margin-bottom:3px; }
  .sev { font-size:10.5px; font-weight:700; padding:0 6px; border-radius:4px; margin-right:4px; background:var(--warn-bg); color:var(--warn-fg); }
  .sev-critical { background:var(--crit-bg); color:var(--crit-fg); }
  .warp { position:fixed; bottom:16px; right:16px; z-index:6; font-family:inherit; font-size:12.5px; padding:8px 16px; border-radius:999px; border:1px solid var(--warn-fg); background:var(--warn-bg); color:var(--warn-fg); cursor:pointer; }
  #toast { position:fixed; bottom:16px; left:16px; background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:12.5px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .note { font-size:12px; color:var(--muted); margin-top:14px; }
  @media (max-width:700px) { .sec { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <span class="title" id="appTitle">📖 コード通訳</span>
  <span class="badge b-warn" id="bProg"></span>
  <span class="badge b-warn" id="bCover"></span>
  <button class="hbtn" id="tVeil"></button>
  <button class="hbtn" id="tTheme" title="配色の切替"></button>
  <span id="ctxbar" style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch"></span>
</header>
<div class="filebar" id="filebar"></div>
<main id="main"></main>
<div id="storybar" hidden></div>
<div id="toast"></div>
<script>
const KW_ALL = {
  ja: {
    "function":"「処理のまとまり」を作る合図", "const":"名前をつけて値を保管する箱", "let":"あとで中身を変えられる箱",
    "if":"もし〜なら", "else":"そうでなければ", "return":"この手順をここで終える合図",
    "await":"結果を待ってから次へ進む", "async":"待ち時間のある処理の目印", "require":"別のファイルの機能を読み込む",
    "for":"繰り返し処理", "while":"条件が続く間繰り返す", "try":"失敗するかもしれない処理を試す",
    "catch":"失敗したときの受け皿", "throw":"エラーを発生させて知らせる", "new":"新しいものを作る",
    "process":"アプリの実行環境(環境変数など)",
  },
  en: {
    "function":"defines a reusable procedure", "const":"a named box holding a value", "let":"a box whose value can change",
    "if":"only if the condition holds", "else":"otherwise", "return":"end here and hand back a result",
    "await":"wait for the result before moving on", "async":"marks a procedure that may involve waiting", "require":"load features from another file",
    "for":"repeat", "while":"repeat while the condition holds", "try":"attempt something that may fail",
    "catch":"handle the failure", "throw":"raise an error", "new":"create a new object",
    "process":"the app's runtime environment (env vars etc.)",
  },
};
let KW = KW_ALL.ja;
const THEMES = ["auto", "light", "dark"];
const UI = {
  ja: {
    themes: { auto: "配色: 自動", light: "配色: ライト", dark: "配色: ダーク" },
    progLeft: n => `残り ${n}個`, progTodo: "回答済み(要対応あり)", progDone: "全部確認ずみ ✓",
    cover: (a, b) => `読めた範囲 ${a}/${b}`, veilOn: "学習中(答えを隠す)", veilOff: "学習モード",
    pick: "見たいコードを押す:", all: "すべて", fleft: n => `残り${n}`,
    guide: `<b>使い方は2つだけ</b><br>① 上の<b>ファイル名のボタンを押す</b>と、そのコードが翻訳つきで表示されます(翻訳はもう終わっています)。<br>② 各まとまりの説明を読んで、<b>「✓ 問題ない / ✗ おかしい / ? わからない」のどれかを押す</b>。気になることは「コメントを書く」にどうぞ。「✗」やコメントは、チャットで「たまった指摘を直して」と言えばAIがまとめて対応します。`,
    gotIt: "わかった(閉じる)", sumLb: "このシステムは何をするものか", author: "書き手",
    caution: "⚠ 注意", lines: s => `${s}行目`,
    btnOk: "✓ 問題ない", btnNg: "✗ おかしい", btnUk: "? わからない",
    ansOk: "✓ 問題ないと回答済み", ansNg: "✗ おかしいと回答済み(チャットで「たまった指摘を直して」)",
    ansUk: "? わからないと回答済み(チャットで聞けば説明します)", undo: "取り消す",
    stOk: "✓ 確認済み", stNg: "✗ 要修正", stUk: "? 保留",
    flowLb: "何が起きるか(押すとそのコードへ)",
    storyBtn: "▶ 順番に読む", storyPrev: "← 前へ", storyNext: "次へ →", storyDone: "おわり",
    crumbIn: "の中",
    guideShort: "使い方: 上のファイル名を押す → 説明を読む → ✓ / ✗ / ? を押す。✗とコメントはチャットで「たまった指摘を直して」と言えばAIが対応。",
    cmtOpen: "コメントを書く", cmtPh: "例: ここは確認画面を挟んでほしい", save: "保存",
    yourCmt: "あなたのコメント", edit: "編集",
    unreadH: "まだ読めていないファイル", unread: "未読",
    vOk: "✅ <b>全部確認できました。</b>すべてのまとまりに「問題ない」と回答済みで、重大な問題は見つかっていません。",
    vNg: "🔒 <b>まだ確認は終わっていません。</b>",
    vRemain: n => `読んでいないまとまりが ${n}個`, vNgs: n => `「✗ おかしい」が ${n}件(チャットで「たまった指摘を直して」)`,
    vUks: n => `「? わからない」が ${n}件(チャットで聞けば説明します)`, vUnread: n => `まだ読めていないファイルが ${n}件`,
    vCrit: n => `重大な問題(キーの置き忘れ等)が ${n}件`, vDirty: "保存(コミット)されていない変更があります",
    findings: n => `自動チェックの記録(参考・${n}件)`,
    note: (t, c) => `生成: ${t} / コードが変わると画面と回答は自動で新しい版に切り替わります。コードの行にマウスを乗せると1行ずつの訳が出ます。${c ? ` / コメント ${c}件` : ""}`,
    warp: n => `⚠ 次の注意箇所へ (${n})`, mechNone: "この箇所への機械検出はなし(AIの読み取りのみ——断定はしていません)",
    mech: "自動チェック", toastUpd: "翻訳が更新されました", toastLocal: "この画面では回答はこの端末にのみ保存されます",
    noData: "まだ翻訳データがありません。チャットで「コードを翻訳して」と言ってください。",
  },
  en: {
    themes: { auto: "Theme: auto", light: "Theme: light", dark: "Theme: dark" },
    progLeft: n => `${n} left`, progTodo: "Answered (action needed)", progDone: "All reviewed ✓",
    cover: (a, b) => `Read ${a}/${b} files`, veilOn: "Learning (answers hidden)", veilOff: "Learning mode",
    pick: "Pick a file:", all: "All", fleft: n => `${n} left`,
    guide: `<b>Just two things</b><br>① <b>Press a file name</b> above — that file appears, already translated.<br>② Read each unit and press <b>"✓ Looks right / ✗ Wrong / ? Not sure"</b>. Anything on your mind goes into "Write a comment". ✗ answers and comments are handled in bulk when you tell the AI "fix the flagged items" in chat.`,
    gotIt: "Got it (close)", sumLb: "What this system does", author: "Author",
    caution: "⚠ Caution", lines: s => `Lines ${s}`,
    btnOk: "✓ Looks right", btnNg: "✗ Wrong", btnUk: "? Not sure",
    ansOk: "✓ Marked as fine", ansNg: '✗ Marked wrong (say "fix the flagged items" in chat)',
    ansUk: "? Marked unsure (ask in chat for an explanation)", undo: "Undo",
    stOk: "✓ Reviewed", stNg: "✗ Flagged", stUk: "? On hold",
    flowLb: "What happens (click to jump to the code)",
    storyBtn: "▶ Read in order", storyPrev: "← Back", storyNext: "Next →", storyDone: "Done",
    crumbIn: "— inside this",
    guideShort: 'How to: press a file name above → read each unit → press ✓ / ✗ / ?. ✗ answers and comments are fixed when you say "fix the flagged items" in chat.',
    cmtOpen: "Write a comment", cmtPh: "e.g. add a confirmation screen before sending", save: "Save",
    yourCmt: "Your comment", edit: "Edit",
    unreadH: "Files not yet read", unread: "unread",
    vOk: "✅ <b>Everything reviewed.</b> Every unit is marked \"Looks right\" and nothing critical was detected.",
    vNg: "🔒 <b>Review not finished yet.</b>",
    vRemain: n => `${n} units not reviewed yet`, vNgs: n => `${n} marked "✗ Wrong" (say "fix the flagged items" in chat)`,
    vUks: n => `${n} marked "? Not sure" (ask in chat for an explanation)`, vUnread: n => `${n} files not yet read`,
    vCrit: n => `${n} critical issues (e.g. a leaked secret key)`, vDirty: "There are uncommitted changes",
    findings: n => `Automated check log (reference, ${n})`,
    note: (t, c) => `Generated: ${t} / The page and answers switch automatically when the code changes. Hover a code line for its line-by-line translation.${c ? ` / Comments: ${c}` : ""}`,
    warp: n => `⚠ Next caution spot (${n})`, mechNone: "No automated detection here (AI reading only — not a guarantee)",
    mech: "Automated check", toastUpd: "Translation updated", toastLocal: "On this page, answers are saved on this device only",
    noData: 'No translation data yet. Ask in chat to translate the code.',
  },
};
let L = UI.ja;
function setLang() {
  const lg = DATA && DATA.lang === "en" ? "en" : "ja";
  L = UI[lg];
  KW = KW_ALL[lg];
  document.body.classList.toggle("en", lg === "en");
  document.documentElement.lang = lg;
  $("appTitle").textContent = lg === "en" ? "📖 Code Interpreter" : "📖 コード通訳";
}
let DATA = null, REVIEW = {}, generatedAt = null, canPost = true, activeFile = "__all__";
let SECKEYS = [], FILEKEYS = [], SECMETA = [], DEFS = {}, REFRE = null;
const DEF_RE = /(?:\bfunction\s+|\bfunc\s+|\bdef\s+|\bclass\s+|\bstruct\s+|\bconst\s+)([A-Za-z_][A-Za-z0-9_]{2,})/;
function buildDefs() {
  DEFS = {};
  for (const f of DATA.files) {
    f.lines.forEach((line, i) => {
      const m = line.match(DEF_RE);
      if (m && !DEFS[m[1]]) DEFS[m[1]] = { file: f.path, line: i + 1 };
    });
  }
  const names = Object.keys(DEFS).sort((a, b) => b.length - a.length);
  REFRE = names.length ? new RegExp("\\b(" + names.join("|") + ")\\b(?![^<]*>)", "g") : null;
}
function inRange(spec, n) {
  const m = String(spec).split("-").map(Number);
  return n >= m[0] && n <= (m[1] || m[0]);
}
function defHeading(name) {
  const d = DEFS[name];
  const s = (DATA.sections || []).find(x => x.file === d.file && inRange(x.lines, d.line));
  return s ? s.heading : d.file;
}
function jumpToLine(file, line, instant) {
  if (activeFile !== "__all__" && activeFile !== file) {
    activeFile = file;
    render();
  }
  const ki = SECMETA.findIndex(m => m && m.file === file && m.a <= line && line <= m.b);
  const el = ki >= 0 ? $("s" + ki) : null;
  if (el) {
    el.scrollIntoView({ behavior: instant ? "auto" : "smooth", block: "center" });
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }
}
function jumpRef(name) {
  const d = DEFS[name];
  if (d) jumpToLine(d.file, d.line);
}
function scopeChain(f, startLine) {
  // この数行を包んでいる関数・クラス名を、インデントを頼りに外側へたどる(最大2階層)
  const lines = f.lines || [];
  let idx = startLine - 1;
  while (idx < lines.length && !(lines[idx] || "").trim()) idx++;
  const indentOf = s => ((s || "").match(/^\s*/) || [""])[0].length;
  let cur = indentOf(lines[idx] || "");
  const chain = [];
  for (let j = idx - 1; j >= 0 && chain.length < 2 && cur > 0; j--) {
    const ln = lines[j] || "";
    if (!ln.trim()) continue;
    const ind = indentOf(ln);
    if (ind < cur) {
      const m = ln.match(DEF_RE);
      if (m && m[1]) chain.unshift(m[1]);
      cur = ind;
    }
  }
  return chain;
}
function jumpFlow(i) {
  // 物語のジャンプは「そのファイルだけに絞って、瞬時にその場面を出す」(巨大ページの飛行スクロールをしない)
  const st = (DATA.flow || [])[i];
  if (!st || !st.file) return;
  if (activeFile !== st.file) {
    activeFile = st.file;
    render();
  }
  jumpToLine(st.file, parseInt(String(st.lines).split("-")[0]) || 1, true);
}
let storyIdx = -1, storyPrevFile = null;
function startStory() { storyPrevFile = activeFile; storyIdx = 0; document.body.classList.add("storying"); showStory(); }
function stepStory(d) { storyIdx += d; showStory(); }
function endStory() {
  storyIdx = -1;
  $("storybar").hidden = true;
  document.body.classList.remove("storying");
  if (storyPrevFile !== null && storyPrevFile !== activeFile) {
    activeFile = storyPrevFile;
    render();
    window.scrollTo({ top: 0 });
  }
  storyPrevFile = null;
}
function showStory() {
  const flow = DATA.flow || [];
  if (storyIdx < 0 || storyIdx >= flow.length) return endStory();
  const st = flow[storyIdx];
  $("storybar").hidden = false;
  $("storybar").innerHTML =
    `<span class="no2">${storyIdx + 1}/${flow.length}</span><span class="tx">${esc(st.text)}</span>` +
    `<button onclick="stepStory(-1)" ${storyIdx === 0 ? "disabled" : ""}>${L.storyPrev}</button>` +
    `<button class="nx" onclick="stepStory(1)">${storyIdx === flow.length - 1 ? L.storyDone : L.storyNext}</button>` +
    `<button onclick="endStory()">✕</button>`;
  jumpFlow(storyIdx);
}
// ブラウザの保存領域は環境によっては読み書き自体が失敗する。失敗しても画面は必ず出す。
const MEM = {};
function lsGet(k) { try { const v = localStorage.getItem(k); return v === null ? (k in MEM ? MEM[k] : null) : v; } catch { return k in MEM ? MEM[k] : null; } }
function lsSet(k, v) { MEM[k] = v; try { localStorage.setItem(k, v); } catch {} }

let VEIL = lsGet("ct-veil") === "1";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const secKey = s => s.file + "|" + s.lines + "|" + s.heading;
const cur = () => { const k = DATA.seal.hash; if (!REVIEW[k]) REVIEW[k] = {}; return REVIEW[k]; };

function applyTheme() {
  const t = lsGet("ct-theme") || "auto";
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  $("tTheme").textContent = L.themes[THEMES.includes(t) ? t : "auto"];
}
$("tTheme").onclick = () => {
  const c = lsGet("ct-theme") || "auto";
  lsSet("ct-theme", THEMES[(THEMES.indexOf(c) + 1) % THEMES.length]);
  applyTheme();
};
$("tVeil").onclick = () => { VEIL = !VEIL; lsSet("ct-veil", VEIL ? "1" : "0"); render(); };

async function saveReview() {
  lsSet("ct-review", JSON.stringify(REVIEW));
  if (!canPost) return;
  try {
    const r = await fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(REVIEW) });
    if (!r.ok) throw 0;
  } catch { canPost = false; toast(L.toastLocal); }
}
function parseLines(spec) {
  const out = [];
  String(spec).split(",").forEach(p => {
    const m = p.split("-").map(Number);
    const [a, b] = m.length === 2 ? m : [m[0], m[0]];
    for (let i = a; i <= b && i - a < 1200; i++) out.push(i);
  });
  return out;
}
function hlLine(raw, file, n) {
  let s = esc(raw), comment = "";
  const ci = s.indexOf("//");
  if (ci >= 0) { comment = `<span class="c-com">${s.slice(ci)}</span>`; s = s.slice(0, ci); }
  s = s.replace(/(&quot;[^&]*?&quot;|'[^']*'|`[^`]*`)/g, '<span class="c-str">$1</span>');
  s = s.replace(/\b(function|const|let|var|if|else|return|await|async|require|for|while|try|catch|throw|new|process)\b/g,
    m => KW[m] ? `<span class="c-key kw" title="${m} = ${KW[m]}">${m}</span>` : `<span class="c-key">${m}</span>`);
  if (REFRE) {
    s = s.replace(REFRE, name => {
      const d = DEFS[name];
      if (!d || (d.file === file && d.line === n)) return name;
      return `<span class="ref" title="→ ${esc(defHeading(name))}" onclick="event.stopPropagation();jumpRef('${name}')">${name}</span>`;
    });
  }
  return (s + comment) || " ";
}

function render() {
  if (!DATA) return;
  const d = DATA, rv = cur();
  const secs = d.sections || [];
  const answered = secs.filter(s => (rv[secKey(s)] || {}).v).length;
  const ngs = secs.filter(s => (rv[secKey(s)] || {}).v === "ng").length;
  const uks = secs.filter(s => (rv[secKey(s)] || {}).v === "uk").length;
  const comments = secs.filter(s => (rv[secKey(s)] || {}).comment).length;
  const crit = d.machine_findings.filter(f => f.severity === "critical").length;
  const remain = secs.length - answered;

  $("bProg").textContent = remain ? L.progLeft(remain) : (ngs || uks) ? L.progTodo : L.progDone;
  $("bProg").className = "badge " + (remain ? "b-warn" : (ngs || uks) ? "b-crit" : "b-ok");
  $("bCover").textContent = L.cover(d.files.length, d.files.length + d.unanalyzed.length);
  $("bCover").className = "badge " + (d.unanalyzed.length ? "b-warn" : "b-ok");
  $("tVeil").textContent = VEIL ? L.veilOn : L.veilOff;
  $("tVeil").className = "hbtn" + (VEIL ? " on" : "");

  SECKEYS = [];
  FILEKEYS = d.files.map(f => f.path);
  const fb = [`<span class="lbl">${L.pick}</span>`];
  fb.push(`<button class="fbtn${activeFile === "__all__" ? " on" : ""}" onclick="setFile(-1)">${L.all}</button>`);
  d.files.forEach((f, fi) => {
    const fsecs = secs.filter(s => s.file === f.path);
    const rem = fsecs.filter(s => !(rv[secKey(s)] || {}).v).length;
    fb.push(`<button class="fbtn${activeFile === f.path ? " on" : ""}" onclick="setFile(${fi})">${esc(f.path)}<span class="fd ${rem ? "warn" : "ok"}">${rem ? L.fleft(rem) : "✓"}</span></button>`);
  });
  $("filebar").innerHTML = fb.join("");

  let h = "";
  if (!lsGet("ct-guide-hide")) {
    h += `<div class="guide"><span>${L.guideShort}</span><button class="gbtn" onclick="hideGuide()">${L.gotIt}</button></div>`;
  }
  h += `<div class="summary"><span class="lb">${L.sumLb}</span><p style="margin:4px 0 0">${esc(d.app_summary)}</p></div>`;
  if (d.flow && d.flow.length) {
    h += `<div class="flow"><span class="lb">${L.flowLb}</span><button class="play" onclick="startStory()">${L.storyBtn}</button><ol>` +
      d.flow.map((st, i) => `<li onclick="jumpFlow(${i})">${esc(st.text)}<span class="fa">${esc(st.file || "")}${st.lines ? ":" + esc(String(st.lines)) : ""}</span></li>`).join("") +
      `</ol></div>`;
  }

  let impCount = 0;
  for (const f of d.files) {
    if (activeFile !== "__all__" && f.path !== activeFile) continue;
    const fsecs = secs.filter(s => s.file === f.path);
    if (!fsecs.length) continue;
    const ltMap = {};
    d.line_translations.filter(t => t.file === f.path).forEach(t => ltMap[t.line] = t);
    h += `<div class="filehead">${esc(f.path)}<span class="role">${f.role ? "— " + esc(f.role) : ""}</span>${f.author ? `<span class="achip">${L.author}: ${esc(f.author)}</span>` : ""}</div><div class="pairsfile">`;
    for (const s of fsecs) {
      const k = secKey(s), st = rv[k] || {};
      const ki = SECKEYS.push(k) - 1;
      const lines = parseLines(s.lines);
      const secCards = d.cards.filter(c => c.file === f.path && parseLines(c.lines).some(n => lines.includes(n)));
      const imp = secCards.length > 0;
      if (imp) impCount++;
      const veiled = VEIL && !imp && !st.v;
      let code = "";
      for (const n of lines) {
        if (n > f.lines.length) break;
        const t = ltMap[n];
        code += `<div class="ln"${t ? ` title="${esc(t.translation)}"` : ""}><span class="no">${n}</span><span>${hlLine(f.lines[n - 1] || "", f.path, n)}</span></div>`;
      }
      const border = st.v === "ok" ? " done-ok" : (st.v === "ng" || st.v === "uk") ? " done-ng" : "";
      SECMETA[ki] = { file: f.path, a: lines[0], b: lines[lines.length - 1] };
      h += `<div class="sec${imp ? " imp" : ""}${border}${veiled ? " veiled" : ""}" id="s${ki}"${veiled ? ` onclick="revealSec(event,this)"` : ""}>
        <div class="sec-l">
          <div class="sec-h">${imp ? `<span class="impb">${L.caution}</span>` : ""}${esc(s.heading)}<span class="sec-a">${L.lines(esc(String(s.lines)))}</span></div>
          ${(() => {
            const ch = scopeChain(f, lines[0]);
            return ch.length ? `<div class="crumb">📦 ${ch.map(n => `<span class="cn" onclick="event.stopPropagation();jumpRef('${n}')">${esc(n)}</span>`).join(" › ")} ${L.crumbIn}</div>` : "";
          })()}
          <div class="sec-p">${esc(s.prose)}</div>
          ${secCards.map(c => `<div class="sec-warn">⚠ ${esc(c.title)} — ${esc(c.body)}</div>`).join("")}
          <div class="ctrl">${st.v
            ? `<span class="st ${st.v}" title="${st.v === "ok" ? L.ansOk : st.v === "ng" ? L.ansNg : L.ansUk}">${st.v === "ok" ? L.stOk : st.v === "ng" ? L.stNg : L.stUk}</span><button class="undo" onclick="ans(event,${ki},null)">${L.undo}</button>`
            : `<button class="ok" onclick="ans(event,${ki},'ok')">${L.btnOk}</button>
               <button class="ng" onclick="ans(event,${ki},'ng')">${L.btnNg}</button>
               <button class="uk" onclick="ans(event,${ki},'uk')">${L.btnUk}</button>`}</div>
          ${st.comment
            ? `<div class="comment-view"><span class="cl">${L.yourCmt}</span><br>${esc(st.comment)} <button class="undo" style="font-size:11px" onclick="editComment(event,${ki})">${L.edit}</button></div>`
            : `<details class="cwrap" onclick="event.stopPropagation()"><summary>${L.cmtOpen}</summary>
               <textarea id="ta-${ki}" placeholder="${L.cmtPh}"></textarea>
               <button class="hbtn" onclick="saveComment(event,${ki})">${L.save}</button></details>`}
        </div>
        <div class="sec-r">${code}</div></div>`;
    }
    h += `</div>`;
  }

  if (d.unanalyzed.length) {
    h += `<h3 style="font-size:13px;color:var(--muted)">${L.unreadH}</h3><div class="findings"><ul>` +
      d.unanalyzed.map(u => `<li><span class="sev">${L.unread}</span>${esc(u.path)} — ${esc(u.reason)}</li>`).join("") + `</ul></div>`;
  }

  const ok = remain === 0 && ngs === 0 && uks === 0 && d.unanalyzed.length === 0 && crit === 0 && !d.seal.dirty;
  h += `<div class="verdict ${ok ? "open" : "locked"}">${ok ? L.vOk : L.vNg}<ul>`
    + (remain ? `<li>${L.vRemain(remain)}</li>` : "")
    + (ngs ? `<li>${L.vNgs(ngs)}</li>` : "")
    + (uks ? `<li>${L.vUks(uks)}</li>` : "")
    + (d.unanalyzed.length ? `<li>${L.vUnread(d.unanalyzed.length)}</li>` : "")
    + (crit ? `<li>${L.vCrit(crit)}</li>` : "")
    + (d.seal.dirty ? `<li>${L.vDirty}</li>` : "")
    + `</ul></div>`;
  if (d.machine_findings.length) {
    h += `<details class="findings"><summary style="cursor:pointer">${L.findings(d.machine_findings.length)}</summary><ul style="margin-top:6px">` +
      d.machine_findings.map(f => `<li><span class="sev sev-${f.severity === "critical" ? "critical" : ""}">${f.severity}</span>${esc(f.file)}:${f.line} — ${esc(f.note)}</li>`).join("") + `</ul></details>`;
  }
  h += `<p class="note">${L.note(new Date(d.generated_at).toLocaleString(DATA.lang === "en" ? "en-US" : "ja-JP"), comments)}</p>`;
  if (impCount) h += `<button class="warp" onclick="nextImp()">${L.warp(impCount)}</button>`;
  $("main").innerHTML = h;
}
function ans(ev, i, v) {
  ev.stopPropagation();
  const k = SECKEYS[i];
  if (k === undefined) return;
  const rv = cur();
  if (!rv[k]) rv[k] = {};
  if (v) { rv[k].v = v; rv[k].t = Date.now(); } else { delete rv[k].v; }
  if (!rv[k].v && !rv[k].comment) delete rv[k];
  saveReview(); render();
}
function saveComment(ev, i) {
  ev.stopPropagation(); ev.preventDefault();
  const k = SECKEYS[i];
  const ta = $("ta-" + i);
  if (k === undefined || !ta || !ta.value.trim()) return;
  const rv = cur();
  if (!rv[k]) rv[k] = {};
  rv[k].comment = ta.value.trim(); rv[k].ct = Date.now();
  saveReview(); render();
}
function editComment(ev, i) {
  ev.stopPropagation();
  const k = SECKEYS[i];
  if (k === undefined) return;
  const rv = cur(), old = (rv[k] || {}).comment || "";
  delete rv[k].comment;
  render();
  const ta = $("ta-" + i);
  if (ta) { ta.closest("details").open = true; ta.value = old; ta.focus(); }
}
function revealSec(ev, el) { ev.stopPropagation(); el.classList.remove("veiled"); el.removeAttribute("onclick"); }
function hideGuide() { lsSet("ct-guide-hide", "1"); render(); }
function setFile(i) { activeFile = i < 0 ? "__all__" : FILEKEYS[i]; impIdx = -1; render(); window.scrollTo({ top: 0 }); }
let impIdx = -1;
function nextImp() {
  const imps = document.querySelectorAll(".sec.imp");
  if (!imps.length) return;
  impIdx = (impIdx + 1) % imps.length;
  imps[impIdx].scrollIntoView({ behavior: "smooth", block: "center" });
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 3000); }

async function load(first) {
  if (window.EMBEDDED_DATA) {
    if (!DATA) {
      DATA = window.EMBEDDED_DATA;
      canPost = false;
      try { REVIEW = JSON.parse(lsGet("ct-review")) || {}; } catch { REVIEW = {}; }
      setLang();
      buildDefs();
      document.title = (DATA.lang === "en" ? "Code Interpreter — " : "コード通訳 — ") + DATA.project_name;
      applyTheme();
      render();
    }
    return;
  }
  try {
    const r = await fetch("view-data.json?ts=" + Date.now());
    const d = await r.json();
    if (d.generated_at !== generatedAt) {
      generatedAt = d.generated_at;
      DATA = d;
      try {
        const rr = await fetch("review.json?ts=" + Date.now());
        REVIEW = rr.ok ? await rr.json() : {};
      } catch { REVIEW = {}; }
      setLang();
      buildDefs();
      document.title = (DATA.lang === "en" ? "Code Interpreter — " : "コード通訳 — ") + d.project_name;
      applyTheme();
      render();
      if (!first) toast(L.toastUpd);
    }
  } catch {
    if (first) $("main").innerHTML = `<p style="color:var(--crit-fg);padding:16px">${L.noData}</p>`;
  }
}
let ctxTick = false;
window.addEventListener("scroll", () => {
  if (ctxTick) return;
  ctxTick = true;
  requestAnimationFrame(() => {
    ctxTick = false;
    if (!SECMETA.length) return;
    let label = "";
    for (let i = 0; i < SECMETA.length; i++) {
      const el = $("s" + i);
      if (!el) continue;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight || 800;
      if (r.bottom > 60 && r.top < vh) {
        const m = SECMETA[i];
        const s = (DATA.sections || []).find(x => x.file === m.file && inRange(x.lines, m.a));
        label = "📍 " + m.file + (s ? " › " + s.heading : "");
        break;
      }
    }
    $("ctxbar").textContent = label;
  });
}, { passive: true });

applyTheme();
load(true);
if (!window.EMBEDDED_DATA) setInterval(() => load(false), 4000);
</script>
